<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Operador Financeiro offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f1f5f9;
        color: #0f172a;
        padding:
          max(24px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
      }

      main {
        width: min(100%, 420px);
        border-radius: 32px;
        background: #ffffff;
        padding: 28px;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.14);
      }

      p:first-child {
        margin: 0 0 12px;
        color: #64748b;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
      }

      p {
        color: #475569;
        line-height: 1.6;
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 999px;
        background: #059669;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 12px 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Operador Financeiro</p>
      <h1>Você está offline</h1>
      <p>
        Não conseguimos carregar o sistema agora. Confira sua conexão e tente novamente.
      </p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
