services:
  - type: web
    name: operador-financeiro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: operador-financeiro-db
          property: connectionString

databases:
  - name: operador-financeiro-db
    databaseName: operador_financeiro
    user: operador
    ipAllowList: []
